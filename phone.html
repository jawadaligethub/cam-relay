<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone Cam</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  body{margin:0;background:#000;color:#fff;font-family:sans-serif;text-align:center}
  video{width:100%;max-height:75vh;transform:scaleX(-1)}
  button{padding:14px 28px;font-size:18px;margin:12px}
</style>
</head>
<body>
  <video id="v" autoplay playsinline muted></video>
  <p id="s">Start dabao</p>
  <button id="start">Start Camera</button>
<script>
const id = new URLSearchParams(location.search).get('id');
const s = document.getElementById('s');
document.getElementById('start').onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    document.getElementById('v').srcObject = stream;
    const peer = new Peer();
    peer.on('open', () => {
      peer.call(id, stream);
      s.textContent = 'Connected ✅ (is page ko khula rakho)';
    });
    peer.on('error', e => s.textContent = 'Error: ' + e.type);
  } catch (e) { s.textContent = 'Camera error: ' + e.message; }
};
</script>
</body>
</html>
